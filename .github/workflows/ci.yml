name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  database:
    name: Base de données (PostGIS)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Migrations + scénarios
        env:
          PGHOST: localhost
          PGUSER: postgres
          PGPASSWORD: postgres
          WITH_POSTGIS: '1'
        run: ./supabase/tests/run_local.sh

  app:
    name: App Flutter
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Générer les dossiers de plateformes manquants
        run: flutter create . --org fr.slowdate --project-name slow_date --platforms=android,ios,web
      - run: flutter pub get
      - name: Analyse statique
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Tests
        run: flutter test
      - name: Build web
        run: flutter build web --release --base-href "/${{ github.event.repository.name }}/"
      - name: Build APK Android (debug, installable directement)
        run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: slow-date-apk
          path: app/build/app/outputs/flutter-apk/app-debug.apk
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: app/build/web

  deploy-web:
    name: Publier la version web (GitHub Pages)
    needs: [app]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
