name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  database:
    name: Base de données (PostGIS)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Migrations + scénarios
        env:
          PGHOST: localhost
          PGUSER: postgres
          PGPASSWORD: postgres
          WITH_POSTGIS: '1'
        run: ./supabase/tests/run_local.sh

  app:
    name: App Flutter
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Générer les dossiers de plateformes manquants
        run: flutter create . --org fr.slowdate --project-name slow_date --platforms=android,ios,web
      - run: flutter pub get
      - name: Analyse statique
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Tests
        run: flutter test
      - name: Build web
        run: flutter build web --release
      - name: Build APK Android (debug, installable directement)
        run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: slow-date-apk
          path: app/build/app/outputs/flutter-apk/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: slow-date-web
          path: app/build/web

  deploy-web:
    name: Publier la version web (Cloudflare Pages)
    needs: [app]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: slow-date-web
          path: web
      - name: Vérifier les secrets Cloudflare
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Ajoutez les secrets CLOUDFLARE_API_TOKEN et CLOUDFLARE_ACCOUNT_ID (Settings > Secrets and variables > Actions)."
            exit 1
          fi
      - name: Créer le projet Pages (si absent)
        run: npx --yes wrangler@3 pages project create slow-date --production-branch main || true
      - name: Déployer
        run: npx --yes wrangler@3 pages deploy web --project-name slow-date --branch main --commit-dirty=true
